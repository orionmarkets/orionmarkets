# Production data stack for one network on the VPS: Postgres + PostgREST + the /rest/v1 gateway apps/api expects.
# Run once per network with its own project name and env file (see docs/HOSTING.md):
#   docker compose -p orion-testnet --env-file /opt/orion/testnet/stack.env -f docker/production/compose.yml up -d
# Every port binds to 127.0.0.1; only Caddy faces the internet.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in stack.env}
      POSTGRES_DB: orion
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:?}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orion"]
      interval: 5s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?}@db:5432/orion
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_SERVER_PORT: "3000"

  gateway:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - rest
    environment:
      TARGET: http://rest:3000
      PORT: "8000"
    volumes:
      - ../../scripts/localnet/supabase-proxy.mjs:/app/proxy.mjs:ro
    command: ["node", "/app/proxy.mjs"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:?}:8000"

volumes:
  pgdata:
